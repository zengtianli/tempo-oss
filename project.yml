name: Tempo
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    # Notarization needs a secure timestamp and no debugging entitlement (Xcode adds get-task-allow otherwise).
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  Tempo:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist"]
      - path: Shared
      - path: icon/AppIcon.icns
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tempo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.tempo
        PRODUCT_NAME: Tempo
    # No dependency on TempoExtension, on purpose: xcodebuild registers every macOS app it builds with
    # LaunchServices (lsregister -f -R -trusted, no setting turns it off), and an app product with the
    # extension inside puts a second, un-notarized copy of the extension in front of Safari. Safari then
    # drops the settings the installed extension stored (2026-10-06). The two targets are built side by
    # side and build.sh puts the extension into build/Tempo.app afterwards, so no copy is ever registered.
  TempoExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Relay.swift
      - path: Shared
      - path: Extension/Resources
        buildPhase: resources
        excludes: ["images"]
      - path: Extension/Resources/images
        type: folder
        buildPhase: resources
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Tempo · 倍速
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: Extension/TempoExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cyou.tianli.tempo.extension
        PRODUCT_NAME: TempoExtension
schemes:
  Tempo:
    build:
      targets:
        Tempo: all
        TempoExtension: all
