<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><img src="images/icon-96.png" alt=""><b>Tempo</b><span data-i18n="brand_subtitle"></span></div>
    <label class="switch" data-i18n-title="toggle_title"><input id="enabled" type="checkbox" data-i18n-aria-label="toggle_title"><i></i></label>
  </header>

  <section class="dial">
    <button id="slower" class="round" data-i18n-title="action_slower" data-i18n-aria-label="action_slower">−</button>
    <button id="speed" class="readout" data-i18n-title="speed_title">1×</button>
    <button id="faster" class="round" data-i18n-title="action_faster" data-i18n-aria-label="action_faster">+</button>
  </section>

  <section id="presets" class="grid"></section>

  <section class="site" id="site">
    <div id="host" class="host"></div>
    <label><input id="siteRule" type="checkbox"> <span data-i18n="site_remember"></span></label>
    <label><input id="siteOff" type="checkbox"> <span data-i18n="site_disable"></span></label>
  </section>

  <details id="more">
    <summary data-i18n="settings_title"></summary>
    <p class="hint" data-i18n="shortcut_hint"></p>
    <div id="keys" class="keys"></div>
    <div class="row">
      <label><span data-i18n="speed_step"></span> <input id="step" type="number" min="0.01" max="1" step="0.05"></label>
      <label><span data-i18n="seek_step"></span> <input id="seek" type="number" min="1" max="600" step="1"> <span data-i18n="seconds"></span></label>
    </div>
    <label class="row"><input id="indicator" type="checkbox"> <span data-i18n="indicator_label"></span></label>
    <label class="row" data-i18n-title="remote_hint"><input id="remote" type="checkbox"> <span data-i18n="remote_label"></span></label>
    <div class="row buttons">
      <button id="export" data-i18n="export_settings"></button>
      <button id="import" data-i18n="import_settings"></button>
      <button id="defaults" data-i18n="restore_defaults"></button>
    </div>
    <textarea id="io" hidden spellcheck="false" data-i18n-placeholder="import_placeholder" data-i18n-aria-label="settings_json"></textarea>
    <div id="note" class="note"></div>
  </details>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
